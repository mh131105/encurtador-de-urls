# Na raiz, ./.specify/desenvolver --check verifica os documentos e exibe as etapas.
# ./.specify/desenvolver executa uma rodada. Repita quando a revisão indicar outro lote local.
schema_version: "1.0"
workflow:
  id: desenvolver
  name: Rodada de desenvolvimento do encurtador
  version: "1.0.0"
  description: Implementa um lote de tarefas locais e revisa as lacunas antes da próxima rodada.
  integration: codex
requires:
  speckit_version: ">=1.4.3"
steps:
  - id: implementar
    command: speckit.implement
    input:
      args: >-
        Adote a persona e o protocolo SDD do AGENTS.md da raiz.
        Na funcionalidade specs/001-encurtador, execute um lote coeso de tarefas
        abertas que possam ser verificadas localmente, respeitando as dependências
        e o trabalho já presente, inclusive em web/. Marque somente os aceites
        comprovados. Preserve os documentos de produto. Deploy, acesso à VPS e
        ensaios externos de HA ou de carga ficam pendentes. Documente o uso
        afetado e informe as tarefas, os ensaios executados e os resultados. Se faltar um recurso, avance no trabalho independente
        do lote e identifique o aceite que continua pendente.
  - id: revisar
    command: speckit.converge
    input:
      args: >-
        Atue como o agente definido no AGENTS.md da raiz, agora em revisão.
        Compare os resultados locais com a especificação, o plano e as tarefas
        existentes. Preserve tarefas pendentes de infraestrutura, evite duplicá-las
        e registre apenas lacunas novas. Informe o próximo lote local ou o bloqueio
        concreto. Encerre a rodada após esta revisão.
