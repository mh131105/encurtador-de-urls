worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;

    upstream encurtador {
        zone encurtador 64k;
        server api-a:3000 max_fails=1 fail_timeout=5s;
        server api-b:3000 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 80;
        include /etc/nginx/encurtador-rotas.conf;
    }
}
