worker_processes 1;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    access_log off;

    upstream encurtador {
        zone encurtador 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server api:3000 resolve;
    }
    server {
        listen 80;
        include /etc/nginx/encurtador-rotas.conf;
    }
}
