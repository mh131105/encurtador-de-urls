root /srv/encurtador;
# $uri contém o caminho normalizado. Preserve o caminho enviado ao separar a consulta.
set $caminho_literal $request_uri;
if ($request_uri ~ "^([^?]*)\?") { set $caminho_literal $1; }

# Só o caminho raiz original recebe o formulário, inclusive após a normalização do NGINX.
location = / {
    if ($request_uri !~ "^/(\?|$)") {
        add_header Cache-Control no-store always;
        return 404;
    }
    try_files /index.html =404;
}
location ^~ /assets/ {
    if ($caminho_literal != $uri) {
        add_header Cache-Control no-store always;
        return 404;
    }
    try_files $uri =404;
}
location ^~ /internal/ {
    add_header Cache-Control no-store always;
    return 404;
}
# O contrato das duas rotas JSON usa 400 também quando o corpo excede 1 MiB.
client_max_body_size 1m;
error_page 413 = @corpo_excedido;
location @corpo_excedido {
    add_header Cache-Control no-store always;
    if ($request_method != POST) { return 413; }
    if ($uri ~ "^/api/v1/(encurtar|redirecionar)$") { return 400; }
    return 413;
}
# A conexão com a API pode terminar antes de chegar uma confirmação HTTP.
error_page 502 504 = @servico_indisponivel;
location @servico_indisponivel {
    add_header Cache-Control no-store always;
    return 503;
}
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
proxy_redirect off;
# O NGINX pode passar ao próximo upstream em erro de conexão. Um POST já enviado nunca é repetido.
proxy_next_upstream error timeout;
proxy_connect_timeout 2s;
# A API admite até 300 s por requisição. Deixe a própria API concluir ou expirar.
proxy_read_timeout 310s;

# O JSON aceita 1 MiB. Cada byte UTF-8 de um acento pode ocupar três bytes (%HH)
# no Location. Os 4 KiB adicionais acomodam o status e os demais cabeçalhos.
location ~ "^/(?:[0-9A-Za-z]{7}|api/v1/redirecionar)$" {
    proxy_pass http://encurtador;
    proxy_buffering off;
    proxy_buffer_size 3076k;
    proxy_buffers 3 3076k;
}
location / {
    proxy_pass http://encurtador;
}
